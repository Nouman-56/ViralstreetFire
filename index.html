                    </div>`;
        }
        
        function renderVideos() {
            let filtered = [...currentVideos];
            if(currentCategory!=='all') filtered=filtered.filter(v=>v.category===currentCategory);
            if(searchQuery) filtered=filtered.filter(v=>v.title && v.title.toLowerCase().includes(searchQuery.toLowerCase()));
            const grid=document.getElementById('videosGrid');
            if(!grid) return;
            if(filtered.length===0){ grid.innerHTML='<div class="empty-state"><i class="fas fa-film fa-3x"></i><p>No videos found</p></div>'; return; }
            grid.innerHTML=filtered.map(v=>renderMovieCard(v)).join('');
        }
        
        function renderSlider() {
            const wrapper=document.getElementById('sliderWrapper');
            if(!wrapper) return;
            if(currentSlides.length===0) wrapper.innerHTML='<div class="slide"><img src="https://images.pexels.com/photos/3184338/pexels-photo-3184338.jpeg?auto=compress&cs=tinysrgb&w=1200"><div class="slide-overlay"><div class="slide-badge">WELCOME</div><div class="slide-title">VIRAL STREET</div><div class="slide-desc">Watch exclusive scandal videos</div></div></div>';
            else wrapper.innerHTML=currentSlides.map(s=>`<div class="slide"><img src="${s.imgUrl}" onerror="this.src='https://images.pexels.com/photos/3184338/pexels-photo-3184338.jpeg?auto=compress&cs=tinysrgb&w=1200'"><div class="slide-overlay"><span class="slide-badge"><i class="fas fa-fire"></i> ${s.badge||'FEATURED'}</span><div class="slide-title">${escapeHtml(s.title)}</div><div class="slide-desc">${escapeHtml(s.desc)}</div></div></div>`).join('');
            updateSliderDots();
        }
        
        function updateSliderDots(){ const dc=document.getElementById('sliderDots'); if(!dc) return; dc.innerHTML=''; for(let i=0;i<currentSlides.length;i++){ const d=document.createElement('div'); d.className='dot'+(i===currentSlide?' active':''); d.addEventListener('click',()=>goToSlide(i)); dc.appendChild(d); } }
        function updateSliderPosition(){ const w=document.getElementById('sliderWrapper'); if(w&&currentSlides.length>0) w.style.transform=`translateX(-${currentSlide*100}%)`; document.querySelectorAll('.dot').forEach((d,i)=>{ d.classList.toggle('active',i===currentSlide); }); }
        function nextSlide(){ if(currentSlides.length){ currentSlide=(currentSlide+1)%currentSlides.length; updateSliderPosition(); resetAutoSlide(); } }
        function prevSlide(){ if(currentSlides.length){ currentSlide=(currentSlide-1+currentSlides.length)%currentSlides.length; updateSliderPosition(); resetAutoSlide(); } }
        function goToSlide(i){ currentSlide=i; updateSliderPosition(); resetAutoSlide(); }
        function startAutoSlide(){ autoSlideInterval=setInterval(nextSlide,5000); }
        function resetAutoSlide(){ clearInterval(autoSlideInterval); startAutoSlide(); }
        
        async function incrementViews(vid){ try{ await db.collection("viral_videos").doc(vid).update({views:firebase.firestore.FieldValue.increment(1)}); }catch(e){ console.error(e); } }
        async function playVideo(id){ const v=currentVideos.find(v=>v.id===id); if(v){ await incrementViews(id); document.getElementById('modalTitle').innerHTML=v.title; document.getElementById('videoSource').src=v.videoUrl; document.getElementById('videoPlayer').load(); document.getElementById('videoModal').classList.add('active'); document.getElementById('videoPlayer').play().catch(e=>console.log('Autoplay blocked')); } }
        function downloadVideo(vid,hasUrl,e){ if(e) e.stopPropagation(); const v=currentVideos.find(v=>v.id===vid); if(v){ if(hasUrl&&v.downloadUrl){ window.open(v.downloadUrl,'_blank'); } else if(v.videoUrl){ const a=document.createElement('a'); a.href=v.videoUrl; a.download=`${v.title}.mp4`; a.click(); } } }
        function closeModal(){ document.getElementById('videoPlayer').pause(); document.getElementById('videoModal').classList.remove('active'); }
        
        function handleSearch(){ searchQuery=document.getElementById('searchInput').value; renderVideos(); }
        function renderCategories(){ const cats=[{id:'premium',name:'🔥 Premium Free'},{id:'indian',name:'🇮🇳 Indian Scandals'},{id:'pakistani',name:'🇵🇰 Pakistani Scandals'},{id:'all',name:'📺 All Videos'}]; document.getElementById('categoriesContainer').innerHTML=cats.map(c=>`<button class="cat-btn ${currentCategory===c.id?'active':''}" data-category="${c.id}">${c.name}</button>`).join(''); document.querySelectorAll('.cat-btn').forEach(btn=>{ btn.addEventListener('click',()=>{ currentCategory=btn.dataset.category; renderCategories(); renderVideos(); updateCategoryTitle(); }); }); }
        function updateCategoryTitle(){ const titles={premium:'🔥 Premium Free Videos',indian:'🇮🇳 Indian Scandals',pakistani:'🇵🇰 Pakistani Scandals',all:'📺 All Videos'}; document.getElementById('categoryTitle').innerHTML=titles[currentCategory]||'All Videos'; }
        
        document.getElementById('searchBtn').addEventListener('click',handleSearch);
        document.getElementById('searchInput').addEventListener('keypress',(e)=>{ if(e.key==='Enter') handleSearch(); });
        document.getElementById('prevSlide').addEventListener('click',prevSlide);
        document.getElementById('nextSlide').addEventListener('click',nextSlide);
        document.getElementById('videoModal').addEventListener('click',(e)=>{ if(e.target===document.getElementById('videoModal')) closeModal(); });
        
        const sC=document.querySelector('.slider-container'); let sX,drag=false;
        if(sC){ sC.addEventListener('touchstart',(e)=>{ sX=e.touches[0].clientX; drag=true; }); sC.addEventListener('touchend',(e)=>{ if(!drag) return; const dx=e.changedTouches[0].clientX-sX; if(Math.abs(dx)>50) dx>0?prevSlide():nextSlide(); drag=false; }); }
        
        window.playVideo=playVideo; window.closeModal=closeModal; window.downloadVideo=downloadVideo;
        
        async function init(){ await seedDefaultData(); attachFirestoreListeners(); renderCategories(); updateCategoryTitle(); }
        init();
    </script>
</body>
</html>
